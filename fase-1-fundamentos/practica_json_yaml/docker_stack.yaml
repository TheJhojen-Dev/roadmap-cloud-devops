---
version: '3.8'
services:
  app:
    image: node:20-alpine
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DB_HOST: db
    depends_on:
      - "db"
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: app_db
      POSTGRES_PASSWORD: secret_pass
    volumes:
      - "pgdata:/var/lib/postgresql/data"
volumes:
  pgdata: {}
